# GoogleWifiLED - optional settings
# OpenWrt 24.10 / 25.12, Google Wifi RGB LED and Passwall2
# PROBE_MODE=node-test: Passwall2's own selected-node test, shunt-compatible.
# PROBE_MODE=socks: query an EXISTING local SOCKS proxy (must be configured).
PROBE_MODE=node-test
CHECK_INTERVAL=30
GREEN_MAX_MS=1099
YELLOW_MAX_MS=1499
# SOCKS_PORT=1070
# PROBE_URL=https://www.google.com/generate_204
# If auto-detection fails, uncomment and set the actual RGB sysfs directories:
# LED_RED_DIR=/sys/class/leds/LED0_Red
# LED_GREEN_DIR=/sys/class/leds/LED0_Green
# LED_BLUE_DIR=/sys/class/leds/LED0_Blue
